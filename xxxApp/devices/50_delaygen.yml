# Stanford Research Systems DG535 (GPIB)
#
# st.cmd boot parameters (supply per instance):
#   gpib_link       GPIB link number -> macro L= (e.g. "1")
#   gpib_addr       GPIB address     -> macro A= (e.g. "15")
_SRS_DG535: &_SRS_DG535
    name: "SRS DG535 ({instance})"
    screen: {label: "{name}", file: "devDG535", macros: "P={prefix},R={instance}"}
    st.cmd: |
        dbLoadRecords(DELAYGEN .. "/delaygenApp/Db/devDG535.db",
                      "P=" .. PREFIX .. ", R=" .. instance ..
                      ", L=" .. gpib_link .. ", A=" .. gpib_addr)

# Colby programmable delay line
#
# st.cmd boot parameters (supply per instance):
#   port            name to give the Colby asyn driver port (e.g. "COL")
#   serial          name of the source serial/IP asyn port (e.g. "serial1")
#   addr            device address field -> macro A= (e.g. "Colby")
#   prec            display precision -> macro PREC= (default 3)
_Colby: &_Colby
    name: "Colby ({instance})"
    prec: "3"
    screen: {label: "{name}", file: "colbyMain", macros: "P={prefix},R={instance}"}
    st.cmd: |
        drvAsynColby(port, serial, -1, "ns", 1)
        dbLoadRecords(DELAYGEN .. "/delaygenApp/Db/colbyPDL100A.db",
                      "P=" .. PREFIX .. ", R=" .. instance ..
                      ", PREC=" .. prec .. ", A=" .. addr .. ", PORT=" .. port)
