# Delay/pulse generator support (delaygen module).
#
# Each delay generator has one top-level device screen reached through its
# register (R=, e.g. "DG1:") under the IOC prefix. The per-channel delay, trigger,
# burst and output panels are modular parts embedded in the main screen and are
# not typed here.
#
# An instance must specify:
#   instance        the device register (e.g. "DG1:") -> macro R=
#   name            (optional) label; defaults per type
#   links           the ordered list of screens the related-display offers,
#                   currently just: screen
#
# The delaygen module ships no iocsh fragment, so each type inlines its real
# startup (grounded in the module's iocBoot example st.cmd + dg645.cmd): a driver
# config call (where the model needs its own asyn driver port) plus a
# dbLoadRecords of the model's database. The underlying serial/GPIB source port
# (drvAsynSerialPortConfigure / gsIP488Configure) is created by whichever device
# owns it and is referenced here via the "serial" / "gpib_*" boot parameters.

# Stanford Research Systems DG645
#
# st.cmd boot parameters (supply per instance):
#   port            name to give the DG645 asyn driver port (e.g. "DG1")
#   serial          name of the source serial/IP asyn port (e.g. "serial1")
_SRS_DG645: &_SRS_DG645
    name: "SRS DG645 ({instance})"
    screen: {label: "{name}", file: "srsDG645", macros: "P={prefix},R={instance}"}
    st.cmd: |
        drvAsynDG645(port, serial, -1)
        dbLoadRecords(DELAYGEN .. "/delaygenApp/Db/drvDG645.db",
                      "P=" .. PREFIX .. ", R=" .. instance .. ", PORT=" .. port)

# Berkeley Nucleonics 505
#
# st.cmd boot parameters (supply per instance):
#   port            name of the source serial/IP asyn port (e.g. "serial1")
_BNC_505: &_BNC_505
    name: "BNC 505 ({instance})"
