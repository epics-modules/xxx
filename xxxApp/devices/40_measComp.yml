# Measurement Computing DAQ device support (measComp module).
#
# Each measComp hardware model has one top-level "*_module" device screen that
# embeds the function panels (analog in/out, counters, DIO, pulse gen) for that
# model. The function panels and plot screens are modular parts, not standalone
# devices, so only the per-model module screens are typed here.
#
# Most models need only the IOC prefix. A few also take a small, fixed set of
# register macros for the sub-functions the model provides (e.g. Ao, Ti, or the
# binary Bd/Bi/Bo/Li/Lo set); these are fixed per model, not positional, so each
# is supplied as a static field on the type.
#
# An instance must specify:
#   prefix          supplied per IOC (boot passthrough / gestalt generation)
#   name            (optional) label; defaults per type
#   links           the ordered list of screens the related-display offers,
#                   currently just: screen
#
# st.cmd boot parameters (supply per instance):
#   port            name to give this device's asyn port (e.g. "USB1808_1")
#   unique_id       the device's unique serial/board id (or "0" for first found)
#
# The measComp module ships no iocsh fragment, so st.cmd inlines the real
# startup: MultiFunctionConfig(port, unique_id, WDIG_POINTS, WGEN_POINTS) then
# dbLoadTemplate of the model's substitutions file (grounded in the module's
# iocBoot example st.cmd files). The per-model "model" field selects the
# substitutions basename and may differ from the screen file name (e.g. the
# _MC_1608G type uses the USB1608G substitutions). Waveform models default
# wdig_points/wgen_points to 0; override per instance where the model supports
# waveform digitizer / generator buffers.

# Shared measComp startup: used by every model via the merge key. The "model"
# field (set per type) names the substitutions file under $(MEASCOMP)/db.
_MC_base: &_MC_base
    wdig_points: "0"
    wgen_points: "0"
    st.cmd: |
        MultiFunctionConfig(port, unique_id, wdig_points, wgen_points)
        dbLoadTemplate(MEASCOMP .. "/db/" .. model .. ".substitutions",
                       "P=" .. PREFIX .. ", PORT=" .. port ..
                       ", WDIG_POINTS=" .. wdig_points ..
                       ", WGEN_POINTS=" .. wgen_points)

# --- prefix-only models ---

_MC_USB1808: &_MC_USB1808
    <<: *_MC_base
    name: "MC USB-1808"
    model: "USB1808"
    screen: {label: "{name}", file: "USB1808_module", macros: "P={prefix}"}

