    fragment: "ADPointGrey"
    pointGrey: {label: "{name}", file: "pointGrey", macros: "P={prefix},R={instance}"}

# ADMarCCD: base, image, marccd
_AD_MarCCD: &_AD_MarCCD
    <<: *_AD_Base
    name: "MarCCD ({instance})"
    fragment: "ADMarCCD"
    marccd: {label: "{name}", file: "marCCD", macros: "P={prefix},R={instance}"}

# ADMar345: base, image, mar345
_AD_Mar345: &_AD_Mar345
    <<: *_AD_Base
    name: "Mar345 ({instance})"
    fragment: "ADMar345"
    mar345: {label: "{name}", file: "mar345", macros: "P={prefix},R={instance}"}

# ADURL: base, image, url. No connection id.
_AD_URL: &_AD_URL
    <<: *_AD_Base_NoId
    name: "ADURL ({instance})"
    fragment: "ADURL"
    url: {label: "{name}", file: "URLDriver", macros: "P={prefix},R={instance}"}
